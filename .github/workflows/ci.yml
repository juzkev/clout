name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest -q --tb=short
        env:
          FRED_API_KEY: ""
          NEWSAPI_KEY: ""
          COINGLASS_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          CLAUDE_API_KEY: ""

      - name: Import smoke test
        run: |
          uv run python -c "
          import config.settings
          import research.run_research
          import strategies.momentum
          import strategies.mean_reversion
          import strategies.btc_funding_rate
          import backtesting.runner
          import execution.ibkr_client
          import notifications.telegram_bot
          print('All imports OK')
          "
