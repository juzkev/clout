name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --tb=short
        env:
          FRED_API_KEY: ""
          NEWSAPI_KEY: ""
          COINGLASS_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          CLAUDE_API_KEY: ""

      - name: Import smoke test
        run: |
          python -c "
          import config.settings
          import research.run_research
          import strategies.momentum
          import strategies.mean_reversion
          import strategies.btc_funding_rate
          import backtesting.runner
          import execution.ibkr_client
          import notifications.telegram_bot
          print('All imports OK')
          "
